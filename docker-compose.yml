services:
  pool-status-board:
    build:
      context: .
      dockerfile: Dockerfile
    image: pool-status-board:latest
    container_name: pool-status-board
    restart: unless-stopped
    ports:
      - "18380:8080"
    environment:
      TZ: Asia/Shanghai
      LISTEN_ADDR: ":8080"
      REFRESH_INTERVAL_SECONDS: "60"
      VIEW_PASSCODE: "${VIEW_PASSCODE:-}"
      CPAMP_BASE_URL: "http://cpa-manager-plus:18317"
      AIS_BASE_URL: "http://aistudio2api:2048"
      CPA_CONTAINER_AUTH_DIR: "/root/.cli-proxy-api"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
    volumes:
      - /vol1/1000/docker/CLIProxyAPI/auths:/mnt/cpa/auths:ro
      - /vol1/1000/docker/CLIProxyAPI/data/antigravity-priority:/mnt/cpa/priority:ro
      - /vol1/1000/docker/CLIProxyAPI/plugins/data/lamplighter:/mnt/cpa/lamplighter:ro
      - /vol1/1000/docker-build/AIStudio2API/.env:/mnt/ais/.env:ro
      - ./quotas.json:/app/quotas.json:ro
      - ./secrets:/mnt/secrets:ro
    networks:
      - cli-proxy-api_default
      - aistudio2api_default
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  cli-proxy-api_default:
    external: true
  aistudio2api_default:
    external: true
