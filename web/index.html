<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>双号池额度与健康度看板</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --bg-subtle: #eef1f6;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #64748b;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 4px 14px rgba(15, 23, 42, 0.03);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --float-shadow: 0 10px 26px rgba(15, 23, 42, 0.14);

      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.12);
      --green-text: #047857;
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.14);
      --amber-text: #b45309;
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --red-text: #b91c1c;
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --blue-text: #1d4ed8;
      --purple: #8b5cf6;
      --purple-bg: rgba(139, 92, 246, 0.13);
      --purple-text: #6d28d9;
      --slate-bg: rgba(100, 116, 139, 0.12);
      --slate-text: #475569;

      --c-claude5: #8b5cf6;
      --c-claudew: #ec4899;
      --c-gemini5: #3b82f6;
      --c-geminiw: #10b981;
      --c-argon: #f59e0b;

      /* Lamplighter semantic quota chart palette */
      --q-full: #0ea5e9;
      --q-high: #10b981;
      --q-medium: #e0aa14;
      --q-low: #c65746;
      --q-empty: #8e2a1f;
      --q-empty-stripe: rgba(255, 255, 255, 0.24);
      --chart-lane: rgba(15, 23, 42, 0.04);
      --chart-hatch: rgba(15, 23, 42, 0.10);
      --chart-select: rgba(59, 130, 246, 0.09);

      --radius: 14px;
      --radius-sm: 9px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --bg-subtle: #111827;
      --surface: #131b29;
      --surface-2: #192336;
      --border: #243047;
      --border-strong: #33425f;
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.28);
      --float-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);

      --green-bg: rgba(16, 185, 129, 0.16);
      --green-text: #34d399;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --amber-text: #fbbf24;
      --red-bg: rgba(239, 68, 68, 0.18);
      --red-text: #f87171;
      --blue-bg: rgba(59, 130, 246, 0.18);
      --blue-text: #60a5fa;
      --purple-bg: rgba(139, 92, 246, 0.2);
      --purple-text: #c4b5fd;
      --slate-bg: rgba(148, 163, 184, 0.15);
      --slate-text: #cbd5e1;

      --q-full: #38bdf8;
      --q-high: #0fae78;
      --q-medium: #ffd862;
      --q-low: #cf4b3a;
      --q-empty: #9a2e22;
      --q-empty-stripe: rgba(0, 0, 0, 0.34);
      --chart-lane: rgba(255, 255, 255, 0.045);
      --chart-hatch: rgba(255, 255, 255, 0.11);
      --chart-select: rgba(59, 130, 246, 0.16);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 18px 48px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .pool-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--slate-bg);
      color: var(--slate-text);
    }
    .status-pill.online { background: var(--green-bg); color: var(--green-text); }
    .status-pill.degraded { background: var(--amber-bg); color: var(--amber-text); }
    .status-pill.offline { background: var(--red-bg); color: var(--red-text); }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sync-meta {
      font-size: 12px;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .seg {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 1px;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .seg button:hover { color: var(--text); }
    .seg button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .seg.seg-sm button {
      font-size: 11.5px;
      padding: 3.5px 9px;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-subtle);
    }

    /* Section headers */
    .section {
      margin-bottom: 26px;
    }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .section-sub {
      font-size: 12px;
      color: var(--text-3);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-ultra { background: var(--purple-bg); color: var(--purple-text); }
    .badge-pro { background: var(--blue-bg); color: var(--blue-text); }
    .badge-free { background: var(--slate-bg); color: var(--slate-text); }
    .badge-green { background: var(--green-bg); color: var(--green-text); }
    .badge-amber { background: var(--amber-bg); color: var(--amber-text); }
    .badge-red { background: var(--red-bg); color: var(--red-text); }
    .badge-blue { background: var(--blue-bg); color: var(--blue-text); }
    .badge-slate { background: var(--slate-bg); color: var(--slate-text); }

    /* KPI strips */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 15px;
      box-shadow: var(--shadow-sm);
    }
    .kpi-label {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .kpi-val {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .kpi-sub {
      font-size: 11.5px;
      color: var(--text-2);
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Antigravity CPAMP-style Cards */
    .ag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 16px;
    }
    .ag-grid.single {
      grid-template-columns: minmax(0, 1fr);
    }
    .ag-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .ag-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ag-identity {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .ag-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }
    .ag-avatar.tier-ultra { background: linear-gradient(135deg, #7c3aed, #db2777); }
    .ag-avatar.tier-pro { background: linear-gradient(135deg, #2563eb, #06b6d4); }
    .ag-avatar.tier-free { background: linear-gradient(135deg, #475569, #64748b); }
    .ag-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }
    .ag-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      flex-wrap: wrap;
    }

    /* CPAMP 4-box historical usage strip */
    .ag-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .ag-stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
    }
    .ag-stat-label {
      font-size: 11px;
      color: var(--text-3);
    }
    .ag-stat-val {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* CPAMP 1:1 Recent Status (20 x 10m bucket capsules) */
    .recent-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .recent-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 9px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .recent-title-group {
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
    }
    .recent-title {
      font-weight: 700;
      color: var(--text);
      font-size: 12.5px;
    }
    .recent-sub {
      font-size: 11px;
      color: var(--text-3);
    }
    .recent-metrics {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      line-height: 1;
    }
    .recent-pill-ok,
    .recent-pill-fail {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .recent-pill-ok { color: var(--green-text); }
    .recent-pill-fail { color: var(--text-3); }
    .recent-pill-fail.has-fail { color: var(--red-text); }
    .recent-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .cpamp-status-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .cpamp-blocks {
      display: flex;
      align-items: center;
      gap: 3px;
      width: 100%;
      min-width: 0;
      position: relative;
      padding: 4px 0;
    }
    .cpamp-block-wrap {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      cursor: pointer;
      padding: 4px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .cpamp-block {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }
    .cpamp-block.idle {
      background: var(--border-strong);
      opacity: 0.42;
    }
    .cpamp-block-wrap:hover .cpamp-block,
    .cpamp-block-wrap.active .cpamp-block {
      transform: scaleY(1.85);
      opacity: 0.96;
    }
    .cpamp-tip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11.5px;
      line-height: 1.45;
      white-space: nowrap;
      box-shadow: var(--float-shadow);
      z-index: 30;
      pointer-events: none;
      color: var(--text);
    }
    .cpamp-block-wrap:hover .cpamp-tip,
    .cpamp-block-wrap.active .cpamp-tip {
      display: block;
    }
    .cpamp-tip.tip-left { left: 0; transform: none; }
    .cpamp-tip.tip-right { left: auto; right: 0; transform: none; }
    .cpamp-tip-time {
      display: block;
      color: var(--text-3);
      font-size: 11px;
      margin-bottom: 2px;
      font-family: var(--font-mono);
    }
    .cpamp-tip-stats {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }
    .cpamp-rate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 50px;
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: var(--slate-bg);
      color: var(--slate-text);
      white-space: nowrap;
    }
    .cpamp-rate.high { background: var(--green-bg); color: var(--green-text); }
    .cpamp-rate.medium { background: var(--amber-bg); color: var(--amber-text); }
    .cpamp-rate.low { background: var(--red-bg); color: var(--red-text); }

    /* Fallback legacy single-request bars */
    .recent-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 22px;
    }
    .recent-bar {
      flex: 1;
      max-width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    .recent-bar.ok { background: var(--green); }
    .recent-bar.fail { background: var(--red); }

    /* Antigravity quota windows */
    .ag-windows {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .win-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .win-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .win-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .win-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .win-pct {
      font-size: 14px;
      font-weight: 700;
    }
    .bar-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--bg-subtle);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .bar-green { background: var(--green); }
    .bar-amber { background: var(--amber); }
    .bar-red { background: var(--red); }
    .bar-slate { background: var(--text-3); }

    .win-foot {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-2);
      min-height: 18px;
      flex-wrap: wrap;
    }
    .win-usage-lines {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .win-reset {
      margin-left: auto;
      color: var(--text-3);
      white-space: nowrap;
    }

    /* Lamplighter-grade Cycle Burn Chart Panel */
    .trend-toggle {
      width: 100%;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-2);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .trend-toggle:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .lamp-panel {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .lamp-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .lamp-toolbar-primary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .lamp-toolbar-secondary {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .lamp-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .lamp-collapse-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 7px;
      padding: 3.5px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .lamp-collapse-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .lamp-chart-box {
      position: relative;
      width: 100%;
      min-width: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .lamp-chart-box svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      touch-action: pan-y;
    }
    .lamp-detail-wrap {
      position: relative;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      min-width: 0;
    }
    .lamp-detail-head {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .lamp-detail-head.scrubbing {
      border-color: var(--blue);
      background: color-mix(in srgb, var(--blue-bg) 45%, var(--surface));
    }
    .lamp-detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 18px;
    }
    .lamp-detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }
    .lamp-scrub-reset {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.4;

    .lamp-tip {

    /* AIStudio Hourly Trend Compact Card */

  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">PS</div>
        <div>
          <div class="brand-title">双号池额度与健康度看板</div>
        </div>
        <div class="pool-badges" id="pool-badges">
          <span class="status-pill"><span class="dot"></span>Antigravity 加载中</span>
          <span class="status-pill"><span class="dot"></span>AIStudio2API 加载中</span>
        </div>
      </div>
      <div class="controls">
        <div class="sync-meta num" id="sync-meta">正在获取快照…</div>
        <div class="seg" role="group" aria-label="视图模式">
          <button type="button" id="view-full" class="active">汇总 + 明细</button>
          <button type="button" id="view-summary">仅看汇总</button>
        </div>
        <button type="button" class="icon-btn" id="btn-refresh" title="立即从看板内存拉取最新快照">刷新</button>
        <button type="button" class="icon-btn" id="btn-theme" title="切换浅色/深色主题">主题</button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="app-root">
      <div class="empty-box">正在加载号池实时快照，请稍候…</div>
    </main>

    <footer class="footer">
      只读公开看板 · 全程脱敏展示 · 仅读取内存快照与本地统计，不产生上游推理消耗
    </footer>
  </div>

  <!-- Passcode Modal -->
  <div class="modal-backdrop" id="passcode-modal">
    <div class="modal">
      <h3>需要访问口令</h3>
      <p>当前看板已启用口令保护，输入一次后将在本浏览器自动记住。</p>
      <form id="passcode-form">
        <input type="password" id="passcode-input" placeholder="请输入访问口令" autocomplete="current-password" />
        <div class="err" id="passcode-err"></div>
        <button type="submit">验证并进入</button>
      </form>
    </div>
  </div>

  <script>
    (() => {
      const POLL_SECONDS = 30;
      const STORAGE_THEME = 'psb_theme';
      const STORAGE_VIEW = 'psb_view_mode';
      const STORAGE_PASS = 'psb_view_passcode';
      const STORAGE_COLLAPSED = 'psb_collapsed_trends';
      const STORAGE_AIS_METRIC = 'psb_ais_hourly_metric';

      const SVG_NS = 'http://www.w3.org/2000/svg';
      const WINDOW_SECONDS = { '5h': 5 * 3600, '7d': 7 * 86400 };
      const RANGES = {
        '5h': [
          { key: '3h', label: '3 小时', ahead: false },
          { key: '6h', label: '6 小时', ahead: true },
          { key: '12h', label: '12 小时', ahead: true },
          { key: '24h', label: '24 小时', ahead: true },
        ],
        '7d': [
          { key: '24h', label: '24 小时', ahead: false },
          { key: '3d', label: '3 天', ahead: false },
          { key: '8d', label: '8 天', ahead: true },
          { key: '15d', label: '15 天', ahead: true },
          { key: '30d', label: '30 天', ahead: true },
        ],
      };
      const LEVEL_EPSILON = 1e-6;
      const RESET_JUMP = 5;
      const RESET_DRIFT = 60;
      const QUANTUM = 2;
      const HOLD_AFTER = 120;
      const CHAR_W = 6.6;
      const LABEL_H = 16;

      // CPAMP ProviderStatusBar exact RGB 3-stop gradient
      const RATE_COLOR_STOPS = [
        { r: 239, g: 68, b: 68 },   // #ef4444 (0%)
        { r: 250, g: 204, b: 21 },  // #facc15 (50%)
        { r: 34, g: 197, b: 94 },   // #22c55e (100%)
      ];

      const SERIES_COLORS = {
        claude_5h: 'var(--c-claude5)',
        claude_weekly: 'var(--c-claudew)',
        gemini_5h: 'var(--c-gemini5)',
        gemini_weekly: 'var(--c-geminiw)',
        argon_weekly: 'var(--c-argon)',
      };

      function loadCollapsedSet() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_COLLAPSED) || '[]');
          return new Set(Array.isArray(raw) ? raw : []);
        } catch {
          return new Set();
        }
      }

      function saveCollapsedSet(set) {
        try {
          localStorage.setItem(STORAGE_COLLAPSED, JSON.stringify([...set]));
        } catch {}
      }

      const state = {
        snapshot: null,
        countdown: POLL_SECONDS,
        viewMode: localStorage.getItem(STORAGE_VIEW) || 'full',
        selectedModel: '',
        selectedTier: 'ALL',
        collapsedTrends: loadCollapsedSet(),
        chartPrefs: new Map(),     // accId -> { window: '5h'|'7d', range5h: '24h', range7d: '8d', selectedGroup: 'gemini' }
        historyCache: new Map(),   // "accId|win|range" -> { data, fetchedAt, loading, error }
        aisHourlyMetric: localStorage.getItem(STORAGE_AIS_METRIC) === 'tokens' ? 'tokens' : 'requests',
        expandedAisAccounts: new Set(),
        passcode: localStorage.getItem(STORAGE_PASS) || '',
        fetching: false,
      };

      function getChartPref(accId) {
        if (!state.chartPrefs.has(accId)) {
          state.chartPrefs.set(accId, {
            window: '5h',
            range5h: '24h',
            range7d: '8d',
            selectedGroup: 'gemini',
          });
        }
        return state.chartPrefs.get(accId);
      }

      function currentRangeOf(pref) {
        return pref.window === '7d' ? pref.range7d : pref.range5h;
      }

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function svgEl(tag, attrs = {}) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v !== undefined && v !== null) node.setAttribute(k, String(v));
        }
        return node;
      }

      function svgText(attrs, text) {
        const node = svgEl('text', attrs);
        node.textContent = text;
        return node;
      }

      // Theme setup
      function initTheme() {
        const saved = localStorage.getItem(STORAGE_THEME);
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(dark ? 'dark' : 'light', false);
      }
      function applyTheme(t, redraw = true) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem(STORAGE_THEME, t);
        document.getElementById('btn-theme').textContent = t === 'dark' ? '浅色' : '深色';
        if (redraw && state.snapshot) {
          redrawVisibleCharts();
        }
      }
      document.getElementById('btn-theme').addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        applyTheme(cur === 'dark' ? 'light' : 'dark', true);
      });

      // Global click-outside handler for touch CPAMP bucket tooltips & mobile chart scrubbing
      const scrubClearers = new Map(); // key -> () => void
      document.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('.cpamp-block-wrap')) {
          document.querySelectorAll('.cpamp-block-wrap.active').forEach(el => el.classList.remove('active'));
        }
        if (!e.target.closest('.lamp-panel') && !e.target.closest('.ais-trend-card')) {
          scrubClearers.forEach(fn => { try { fn(); } catch {} });
        }
      });

      // Resize observer / window resize debounced redraw for crisp non-distorted SVGs
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (state.snapshot) redrawVisibleCharts();
        }, 140);
      });

      // View toggle
      function syncViewButtons() {
        document.getElementById('view-full').classList.toggle('active', state.viewMode === 'full');
        document.getElementById('view-summary').classList.toggle('active', state.viewMode === 'summary');
      }
      document.getElementById('view-full').addEventListener('click', () => {
        state.viewMode = 'full';
        localStorage.setItem(STORAGE_VIEW, 'full');
        syncViewButtons();
        render();
      });
      document.getElementById('view-summary').addEventListener('click', () => {
        state.viewMode = 'summary';
        localStorage.setItem(STORAGE_VIEW, 'summary');
        syncViewButtons();
        render();
      });
      document.getElementById('btn-refresh').addEventListener('click', () => {
        fetchSnapshot(true);
      });

      // Passcode form
      document.getElementById('passcode-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('passcode-input');
        const err = document.getElementById('passcode-err');
        const val = input.value.trim();
        if (!val) {
          err.textContent = '请输入访问口令';
          return;
        }
        state.passcode = val;
        err.textContent = '';
        const ok = await fetchSnapshot(true);
        if (ok) {
          localStorage.setItem(STORAGE_PASS, val);
          document.getElementById('passcode-modal').classList.remove('show');
          input.value = '';
        } else {
          err.textContent = '口令不正确，请重试';
        }
      });

      // ---------- Formatters ----------
      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function fmtCompact(n) {
        if (n == null || !Number.isFinite(n)) return '—';
        const abs = Math.abs(n);
        if (abs >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
        if (abs >= 1e6) return (n / 1e6).toFixed(abs >= 1e8 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
        if (abs >= 1e3) return (n / 1e3).toFixed(abs >= 1e5 ? 0 : 1).replace(/\.?0+$/, '') + 'K';
        return Math.round(n).toLocaleString('en-US');
      }

      function fmtInt(n) {
        if (n == null || !Number.isFinite(n)) return '—';
        return Math.round(n).toLocaleString('en-US');
      }

      function fmtCost(v) {
        if (v == null || !Number.isFinite(v)) return '—';
        if (v >= 1000) return '$' + (v / 1000).toFixed(2) + 'K';
        return '$' + v.toFixed(2);
      }

      function fmtPct(v, decimals = 2) {
        if (v == null || !Number.isFinite(v)) return '—';
        if (v >= 100) return '100%';
        if (v <= 0) return '0%';
        if (v > 99.99 && v < 100) return '99.99%';
        return v.toFixed(decimals).replace(/\.?0+$/, '') + '%';
      }

      function fmtCpampRate(v) {
        if (v == null || !Number.isFinite(v)) return '--';
        const rounded = v.toFixed(1);
        return (rounded.endsWith('.0') ? rounded.slice(0, -2) : rounded) + '%';
      }

      function fmtRoundPct(v) {
        return v == null || !Number.isFinite(v) ? '—' : Math.round(v) + '%';
      }

      function fmtDiffPct(d) {
        if (d == null || !Number.isFinite(d)) return '—';
        if (d > 0) return '+' + Math.abs(d) + '%';
        if (d < 0) return '−' + Math.abs(d) + '%';
        return '0%';
      }

      function fmtMs(ms) {
        if (!ms || ms <= 0) return '—';
        if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
        return Math.round(ms) + 'ms';
      }

      function pad2(n) { return String(n).padStart(2, '0'); }

      function toShanghaiParts(ms) {
        const d = new Date(ms + 8 * 3600 * 1000);
        return {
          M: d.getUTCMonth() + 1,
          D: d.getUTCDate(),
          h: d.getUTCHours(),
          m: d.getUTCMinutes(),
          s: d.getUTCSeconds(),
        };
      }

      function fmtClock(ms) {
        if (!ms) return '—';
        const p = toShanghaiParts(ms);
        return `${pad2(p.h)}:${pad2(p.m)}:${pad2(p.s)}`;
      }

      function fmtHM(ms) {
        if (!ms) return '—';
        const p = toShanghaiParts(ms);
        return `${pad2(p.h)}:${pad2(p.m)}`;
      }

      function fmtDay(ms) {
        if (!ms) return '—';
        const p = toShanghaiParts(ms);
        return `${pad2(p.M)}/${pad2(p.D)}`;
      }

      function fmtDateTime(ms) {
        if (!ms) return '—';
        const p = toShanghaiParts(ms);
        return `${pad2(p.M)}-${pad2(p.D)} ${pad2(p.h)}:${pad2(p.m)}`;
      }

      function fmtCompactCountdown(targetMs) {
        if (!targetMs || targetMs <= 0) return '—';
        const diffMs = targetMs - Date.now();
        if (diffMs <= 0) return '即将重置';
        const mins = Math.round(diffMs / 60000);
        if (mins < 60) return `${mins}m`;
        const h = Math.floor(mins / 60);
        if (h < 24) return `${h}h ${pad2(mins % 60)}m`;
        return `${Math.floor(h / 24)}d ${h % 24}h`;
      }

      function fmtCountdown(targetMs, suffix = '后重置') {
        if (!targetMs || targetMs <= 0) return '待采样';
        const diff = Math.floor((targetMs - Date.now()) / 1000);
        if (diff <= 0) return '即将重置';
        const d = Math.floor(diff / 86400);
        const h = Math.floor((diff % 86400) / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        if (d > 0) return `${d}天 ${h}小时${suffix}`;
        if (h > 0) return `${h}小时 ${pad2(m)}分${suffix}`;
        if (m > 0) return `${m}分 ${pad2(s)}秒${suffix}`;
        return `${s}秒${suffix}`;
      }

      function fmtHMS(targetMs) {
        if (!targetMs || targetMs <= 0) return '--:--:--';
        const diff = Math.max(0, Math.floor((targetMs - Date.now()) / 1000));
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
      }

      function rateToColor(rate) {
        const t = Math.max(0, Math.min(1, rate));
        const seg = t < 0.5 ? 0 : 1;
        const localT = seg === 0 ? t * 2 : (t - 0.5) * 2;
        const from = RATE_COLOR_STOPS[seg];
        const to = RATE_COLOR_STOPS[seg + 1];
        const r = Math.round(from.r + (to.r - from.r) * localT);
        const g = Math.round(from.g + (to.g - from.g) * localT);
        const b = Math.round(from.b + (to.b - from.b) * localT);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function barColorClass(pct) {
        if (pct >= 50) return 'bar-green';
        if (pct >= 20) return 'bar-amber';
        return 'bar-red';
      }

      function pctTextColor(pct) {
        if (pct >= 50) return 'var(--green-text)';
        if (pct >= 20) return 'var(--amber-text)';
        return 'var(--red-text)';
      }

      function tierBadgeClass(tier) {
        const t = String(tier || '').toLowerCase();
        if (t === 'ultra') return 'badge-ultra';
        if (t === 'pro') return 'badge-pro';
        return 'badge-free';
      }

      function statusBadgeClass(st) {
        switch (st) {
          case 'available':
          case 'ready':
            return 'badge-green';
          case 'busy':
            return 'badge-blue';
          case 'limited':
          case 'cooldown':
            return 'badge-amber';
          case 'exhausted':
          case 'exhausted_requests':
          case 'exhausted_tokens':
          case 'auth_required':
          case 'unavailable':
          case 'restricted':
            return 'badge-red';
          default:
            return 'badge-slate';
        }
      }

      // ---------- Data Fetching ----------
      function authHeaders() {
        const h = {};
        if (state.passcode) h['X-View-Passcode'] = state.passcode;
        return h;
      }

      async function fetchSnapshot(manual = false) {
        if (state.fetching) return false;
        state.fetching = true;
        try {
          const resp = await fetch('/api/snapshot', { headers: authHeaders(), cache: 'no-store' });
          if (resp.status === 401) {
            document.getElementById('passcode-modal').classList.add('show');
            return false;
          }
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          state.snapshot = await resp.json();
          state.countdown = POLL_SECONDS;
          render();
          // Quietly refresh visible expanded history panels
          refreshVisibleHistories(manual);
          return true;
        } catch {
          if (!state.snapshot) {
            document.getElementById('app-root').innerHTML =
              `<div class="empty-box">暂时无法获取状态快照，将在稍后自动重试…</div>`;
          }
          return false;
        } finally {
          state.fetching = false;
          updateSyncMeta();
        }
      }

      function historyCacheKey(accId, win, range) {
        return `${accId}|${win}|${range}`;
      }

      async function fetchAccountHistory(accId, win, range, force = false) {
        const key = historyCacheKey(accId, win, range);
        const cached = state.historyCache.get(key);
        const now = Date.now();
        if (!force && cached && cached.data && now - cached.fetchedAt < 55_000) {
          return cached.data;
        }
        if (cached && cached.loading) return cached.data || null;

        state.historyCache.set(key, {
          data: cached?.data || null,
          fetchedAt: cached?.fetchedAt || 0,
          loading: true,
          error: null,
        });

        try {
          const qs = new URLSearchParams({ account: accId, window: win, range });
          const resp = await fetch(`/api/antigravity/history?${qs.toString()}`, {
            headers: authHeaders(),
            cache: 'no-store',
          });
          if (resp.status === 401) {
            document.getElementById('passcode-modal').classList.add('show');
            state.historyCache.set(key, { data: cached?.data || null, fetchedAt: 0, loading: false, error: '需要口令' });
            return null;
          }
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          state.historyCache.set(key, { data, fetchedAt: Date.now(), loading: false, error: null });
          renderAccountHistoryPanel(accId);
          return data;
        } catch {
          state.historyCache.set(key, {
            data: cached?.data || null,
            fetchedAt: cached?.fetchedAt || 0,
            loading: false,
            error: '历史数据暂不可用',
          });
          renderAccountHistoryPanel(accId);
          return null;
        }
      }

      function refreshVisibleHistories(force = false) {
        const ag = state.snapshot?.antigravity;
        if (!ag || !ag.accounts) return;
        for (const acc of ag.accounts) {
          if (!acc.has_history || state.collapsedTrends.has(acc.id)) continue;
          const pref = getChartPref(acc.id);
          fetchAccountHistory(acc.id, pref.window, currentRangeOf(pref), force);
        }
      }

      function updateSyncMeta() {
        const el = document.getElementById('sync-meta');
        if (!state.snapshot) {
          el.textContent = '正在获取快照…';
          return;
        }
        el.textContent = `更新于 ${fmtClock(state.snapshot.generated_at_ms)} · ${state.countdown}s 后刷新`;
      }

      function renderTopBadges() {
        const snap = state.snapshot;
        if (!snap) return;
        const ag = snap.antigravity;
        const ais = snap.aistudio;
        const agLabel = ag.status === 'online' ? '在线' : ag.status === 'degraded' ? (ag.cpamp_message || '部分降级') : '离线';
        const aisLabel = ais.status === 'online' ? '在线' : ais.status === 'degraded' ? (ais.status_message || '降级') : '离线';

        document.getElementById('pool-badges').innerHTML = `
          <span class="status-pill ${esc(ag.status)}"><span class="dot"></span>Antigravity · ${esc(agLabel)}</span>
          <span class="status-pill ${esc(ais.status)}"><span class="dot"></span>AIStudio2API · ${esc(aisLabel)}</span>
        `;
      }

      // ---------- Render Antigravity ----------
      function renderAntigravity(ag) {
        const tierStr = ['Ultra', 'Pro', 'Free', 'Unknown']
          .filter(t => (ag.summary.tier_counts || {})[t] > 0)
          .map(t => `<span class="badge ${tierBadgeClass(t)}">${esc(t)} ×${ag.summary.tier_counts[t]}</span>`)
          .join('');

        const cpampBadge = ag.cpamp_status === 'ok'
          ? `<span class="badge badge-green">CPAMP 统计已同步</span>`
          : `<span class="badge badge-amber">${esc(ag.cpamp_message || '待接入密钥')}</span>`;

        const avgPills = (ag.summary.window_averages || []).map(w => `
          <span class="badge ${w.avg_remaining_percent >= 50 ? 'badge-green' : w.avg_remaining_percent >= 20 ? 'badge-amber' : 'badge-red'} num">
            ${esc(w.label)} ${fmtPct(w.avg_remaining_percent, 1)}
          </span>
        `).join('');

        const showSummaryStrip = ag.accounts.length > 1 || state.viewMode === 'summary';
        const summaryHtml = showSummaryStrip ? `
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">活跃启用账号</div>
              <div class="kpi-val num">${fmtInt(ag.summary.active_accounts)}</div>
              <div class="kpi-sub">${tierStr || '无启用账号'}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">历史总请求 / Token</div>
              <div class="kpi-val num">${ag.cpamp_status === 'ok' ? fmtCompact(ag.summary.total_requests) : '待接入'}</div>
              <div class="kpi-sub num">${ag.cpamp_status === 'ok' ? '总 Token ' + fmtCompact(ag.summary.total_tokens) : esc(ag.cpamp_message || '待接入密钥')}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">历史估算费用 / 成功率</div>
              <div class="kpi-val num">${ag.cpamp_status === 'ok' ? fmtCost(ag.summary.total_cost) : '待接入'}</div>
              <div class="kpi-sub num">${ag.summary.weighted_success_rate != null ? '成功率 ' + fmtPct(ag.summary.weighted_success_rate, 1) : '—'}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">各窗口平均余量</div>
              <div class="kpi-sub" style="margin-top:6px;">${avgPills || '<span class="section-sub">暂无采样</span>'}</div>
            </div>
          </div>
        ` : '';

        let cardsHtml = '';
        if (ag.accounts.length === 0) {
          cardsHtml = `<div class="empty-box">当前未检测到启用中的 Antigravity 账号</div>`;
        } else if (state.viewMode === 'full' || ag.accounts.length === 1) {
          const gridClass = ag.accounts.length === 1 ? 'ag-grid single' : 'ag-grid';
          cardsHtml = `<div class="${gridClass}">${ag.accounts.map(renderAGCard).join('')}</div>`;
        }

        return `
          <section class="section">
            <div class="section-head">
              <div class="section-title-wrap">
                <h2 class="section-title">Antigravity 号池</h2>
                <span class="section-sub">CLIProxyAPI</span>
                ${tierStr}
                ${cpampBadge}
              </div>
              <div class="section-sub num">活跃启用 ${fmtInt(ag.summary.active_accounts)} 个</div>
            </div>
            ${summaryHtml}
            ${cardsHtml}
          </section>
        `;
      }

      function renderRecentStatusBlock(h) {
        // 1:1 CPAMP native 20x10m bucket capsules from GET /v0/management/auth-files
        if (h.has_recent_buckets && Array.isArray(h.recent_buckets) && h.recent_buckets.length > 0) {
          const buckets = h.recent_buckets;
          const totalOk = h.recent_window_success || 0;
          const totalFail = h.recent_window_failure || 0;
          const hasData = totalOk + totalFail > 0;
          const rate = h.recent_window_rate;
          const rateCls = !hasData ? '' : rate >= 90 ? 'high' : rate >= 50 ? 'medium' : 'low';
          const nowMs = state.snapshot?.generated_at_ms || Date.now();
          const bucketMs = 10 * 60 * 1000;
          const windowStartMs = nowMs - buckets.length * bucketMs;

          const blocksHtml = buckets.map((b, idx) => {
            const ok = b.success || 0;
            const fail = b.failed || 0;
            const tot = ok + fail;
            const isIdle = tot === 0;
            const bRate = isIdle ? -1 : ok / tot;
            const styleAttr = isIdle ? '' : `style="background-color:${rateToColor(bRate)}"`;
            const posCls = idx <= 2 ? 'tip-left' : idx >= buckets.length - 3 ? 'tip-right' : '';
            const timeRange = b.time || `${fmtHM(windowStartMs + idx * bucketMs)}-${fmtHM(windowStartMs + (idx + 1) * bucketMs)}`;
            const statsHtml = tot > 0
              ? `<span class="cpamp-tip-stats">
                   <span style="color:var(--green-text);font-weight:700;">成功 ${fmtInt(ok)}</span>
                   <span style="color:${fail > 0 ? 'var(--red-text)' : 'var(--text-3)'};font-weight:700;">失败 ${fmtInt(fail)}</span>
                   <span style="color:var(--text-3);">(${(bRate * 100).toFixed(1).replace(/\.0$/, '')}%)</span>
                 </span>`
              : `<span style="color:var(--text-3);">无请求</span>`;

            return `
              <div class="cpamp-block-wrap" data-cpamp-block="1">
                <div class="cpamp-block ${isIdle ? 'idle' : ''}" ${styleAttr}></div>
                <div class="cpamp-tip ${posCls}">
                  <span class="cpamp-tip-time">${esc(timeRange)}</span>
                  ${statsHtml}
                </div>
              </div>
            `;
          }).join('');

          const latestHint = h.latest_request_at_ms
            ? ` · 最近请求 ${fmtHM(h.latest_request_at_ms)}`
            : '';

          return `
            <div class="recent-box">
              <div class="recent-head">
                <div class="recent-title-group">
                  <span class="recent-title">最近状态</span>
                  <span class="recent-sub num">近 ${h.recent_window_minutes || 200} 分钟 · 10 分钟/格${esc(latestHint)}</span>
                </div>
                <div class="recent-metrics">
                  <span class="recent-pill-ok" title="近 200 分钟成功请求数"><span class="recent-pill-dot"></span><strong>${fmtInt(totalOk)}</strong></span>
                  <span class="recent-pill-fail ${totalFail > 0 ? 'has-fail' : ''}" title="近 200 分钟失败请求数"><span class="recent-pill-dot"></span><strong>${fmtInt(totalFail)}</strong></span>
                </div>
              </div>
              <div class="cpamp-status-bar">
                <div class="cpamp-blocks">${blocksHtml}</div>
                <span class="cpamp-rate ${rateCls}">${hasData ? fmtCpampRate(rate) : '--'}</span>
              </div>
            </div>
          `;
        }

        // Graceful fallback to recent_bars if older upstream has no bucket field
        const bars = h.recent_bars || [];
        if (bars.length > 0) {
          const barNodes = bars.map(b => {
            const tip = `${b.ok ? '成功' : '失败'}${b.status_code ? ' · HTTP ' + b.status_code : ''}${b.timestamp_ms ? ' · ' + fmtDateTime(b.timestamp_ms) : ''}`;
            return `<div class="recent-bar ${b.ok ? 'ok' : 'fail'}" title="${esc(tip)}"></div>`;
          }).join('');
          return `
            <div class="recent-box">
              <div class="recent-head">
                <span class="recent-title">最近状态（近 ${bars.length} 次）</span>
                <span class="num" style="font-weight:700;color:${pctTextColor(h.recent_success_rate ?? 100)}">${h.recent_success_count}/${bars.length} · ${fmtPct(h.recent_success_rate, 1)}</span>
              </div>
              <div class="recent-bars">${barNodes}</div>
            </div>
          `;
        }

        return `
          <div class="recent-box" style="display:flex;align-items:center;justify-content:space-between;">
            <span class="recent-title">最近状态</span>
            <span class="badge badge-amber">${esc(h.status_note || '暂无记录')}</span>
          </div>
        `;
      }

      function renderAGCard(acc) {
        const tierCls = 'tier-' + String(acc.tier || 'free').toLowerCase();
        const initials = (acc.tier ? acc.tier[0].toUpperCase() : 'A') + (acc.code_name.match(/#(\d+)/)?.[1] || '1');
        const h = acc.history || {};

        let statsBlock = '';
        if (h.available) {
          statsBlock = `
            <div class="ag-stats-grid">
              <div class="ag-stat-box">
                <div class="ag-stat-label">历史请求</div>
                <div class="ag-stat-val num">${fmtCompact(h.total_requests)}</div>
              </div>
              <div class="ag-stat-box">
                <div class="ag-stat-label">历史 Token</div>
                <div class="ag-stat-val num">${fmtCompact(h.total_tokens)}</div>
              </div>
              <div class="ag-stat-box">
                <div class="ag-stat-label">历史费用</div>
                <div class="ag-stat-val num">${fmtCost(h.total_cost)}</div>
              </div>
              <div class="ag-stat-box">
                <div class="ag-stat-label">历史成功率</div>
                <div class="ag-stat-val num" style="color:${h.success_rate != null ? pctTextColor(h.success_rate) : 'inherit'}">${h.success_rate != null ? fmtPct(h.success_rate, 1) : '—'}</div>
              </div>
            </div>
          `;
        }

        const recentBlock = (h.available || h.has_recent_buckets)
          ? renderRecentStatusBlock(h)
          : `
            <div class="recent-box" style="display:flex;align-items:center;justify-content:space-between;">
              <span style="color:var(--text-2);font-size:12.5px;">历史用量与最近状态</span>
              <span class="badge badge-amber">${esc(h.status_note || '待接入密钥')}</span>
            </div>
          `;

        const winHtml = (acc.windows || []).map(w => {
          const dotColor = SERIES_COLORS[w.key] || 'var(--blue)';
          const lines = [];
          if (w.has_current_usage) {
            lines.push(`<span class="num">本窗已用 <strong>${fmtCost(w.current_cost)}</strong> / ${fmtCompact(w.current_tokens)}</span>`);
          }
          if (w.has_forecast) {
            const tag = w.forecast_basis === 'previous' ? '上期参考' : '满额预测';
            lines.push(`<span class="num" style="color:var(--text-3)">${tag} <strong>${fmtCost(w.forecast_cost)}</strong> / ${fmtCompact(w.forecast_tokens)}</span>`);
          }
          const resetText = w.stale
            ? '等待下次采样'
            : `<span class="cd-target num" data-ts="${w.reset_at_ms}" data-suffix="后重置" title="重置时刻: ${esc(fmtDateTime(w.reset_at_ms))}">${esc(fmtCountdown(w.reset_at_ms, '后重置'))}</span>`;

          return `
            <div class="win-box">
              <div class="win-top">
                <div class="win-title"><span class="win-dot" style="background:${dotColor}"></span>${esc(w.label)}</div>
                <div class="win-pct num" style="color:${pctTextColor(w.remaining_percent)}">${fmtPct(w.remaining_percent, 2)}</div>
              </div>
              <div class="bar-track">
                <div class="bar-fill ${barColorClass(w.remaining_percent)}" style="width:${Math.max(0, Math.min(100, w.remaining_percent))}%"></div>
              </div>
              <div class="win-foot">
                <div class="win-usage-lines">${lines.join('')}</div>
                <div class="win-reset">${resetText}</div>
              </div>
            </div>
          `;
        }).join('');

        const isCollapsed = state.collapsedTrends.has(acc.id);
        const trendHtml = acc.has_history ? `
          <div>
            ${isCollapsed
              ? `<button type="button" class="trend-toggle" data-trend-toggle="${esc(acc.id)}">展开额度变化与周期燃烧分析 ▼</button>`
              : `<div class="lamp-panel" data-lamp-panel="${esc(acc.id)}"></div>`
            }
          </div>
        ` : '';

        return `
          <article class="ag-card">
            <div class="ag-card-head">
              <div class="ag-identity">
                <div class="ag-avatar ${tierCls}">${esc(initials)}</div>
                <div>
                  <div class="ag-name">${esc(acc.code_name)}</div>
                  <div class="ag-badges">
                    <span class="badge ${tierBadgeClass(acc.tier)}">${esc(acc.tier)}</span>
                    <span class="badge ${statusBadgeClass(acc.status)}">${esc(acc.status_label)}</span>
                  </div>
                </div>
              </div>
              <div class="section-sub num">${(acc.windows || []).length} 个活跃配额窗口</div>
            </div>
            ${statsBlock}
            ${recentBlock}
            <div class="ag-windows">${winHtml || '<div class="section-sub">暂无配额采样数据</div>'}</div>
            ${trendHtml}
          </article>
        `;
      }

      // ---------- Lamplighter-grade Cycle Burn Chart Engine ----------
      function quotaLevel(remaining) {
        if (remaining <= LEVEL_EPSILON) return 'empty';
        if (remaining >= 100 - LEVEL_EPSILON) return 'full';
        if (remaining <= 20) return 'low';
        if (remaining <= 50) return 'medium';
        return 'high';
      }

      function levelColor(level) {
        switch (level) {
          case 'full': return cssVar('--q-full');
          case 'high': return cssVar('--q-high');
          case 'medium': return cssVar('--q-medium');
          case 'low': return cssVar('--q-low');
          case 'empty': return cssVar('--q-empty');
          default: return cssVar('--border-strong');
        }
      }

      function cycleFloor(points) {
        let low = null;
        return points.map(p => {
          low = (low == null || p[1] - low >= RESET_JUMP) ? p[1] : Math.min(low, p[1]);
          return [p[0], low];
        });
      }

      function valueAt(points, t) {
        let val = null;
        for (let i = 0; i < points.length; i++) {
          if (points[i][0] <= t) val = points[i];
          else break;
        }
        return val;
      }

      function splitRuns(points, limit, end) {
        const out = [];
        let cur = [];
        for (const p of points) {
          if (cur.length && p[0] - cur[cur.length - 1][0] > limit) {
            out.push(cur);
            cur = [];
          }
          cur.push(p);
        }
        if (cur.length) out.push(cur);
        return out.map((pts, i) => {
          const last = pts[pts.length - 1][0];
          const stop = i === out.length - 1 ? Math.min(end, last + limit) : last + Math.min(limit, 300);
          return { pts, start: pts[0][0], end: Math.max(stop, last) };
        });
      }

      function splitAtResets(pts) {
        if (!pts.length) return { parts: [], resets: [] };
        const parts = [[pts[0]]];
        const resets = [];
        for (let i = 1; i < pts.length; i++) {
          const up = pts[i][1] - pts[i - 1][1] >= RESET_JUMP;
          if (up && parts.length > 1 && parts[parts.length - 1].length === 1) {
            parts[parts.length - 1] = [];
            resets[resets.length - 1] = pts[i][0];
          } else if (up) {
            parts.push([]);
            resets.push(pts[i][0]);
          }
          parts[parts.length - 1].push(pts[i]);
        }
        // Hold each cycle's last observed value horizontally until the exact reset sample
        for (let k = 0; k + 1 < parts.length; k++) {
          const tail = parts[k][parts[k].length - 1];
          parts[k].push([parts[k + 1][0][0], tail[1]]);
        }
        return { parts, resets };
      }

      // Pool Adjacent Violators Algorithm (monotone non-increasing within a cycle)
      function declining(pts) {
        const blocks = [];
        for (const p of pts) {
          blocks.push({ sum: p[1], n: 1 });
          while (blocks.length > 1) {
            const top = blocks[blocks.length - 1];
            const prev = blocks[blocks.length - 2];
            if (top.sum / top.n <= prev.sum / prev.n) break;
            prev.sum += top.sum;
            prev.n += top.n;
            blocks.pop();
          }
        }
        const out = [];
        let idx = 0;
        for (const b of blocks) {
          const avg = b.sum / b.n;
          for (let j = 0; j < b.n; j++, idx++) {
            out.push([pts[idx][0], avg]);
          }
        }
        return out;
      }

      function curvePoints(pts) {
        return pts.filter((p, i) => {
          if (i === 0 || i === pts.length - 1 || p[1] !== pts[i - 1][1]) return true;
          return Math.abs(pts[i + 1][1] - p[1]) > QUANTUM;
        });
      }

      // Fritsch-Carlson monotone cubic spline (smooth, zero overshoot)
      function monotonePath(xy) {
        const n = xy.length;
        if (n === 0) return '';
        if (n < 3) return xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join('');
        const dx = new Array(n - 1);
        const m = new Array(n - 1);
        const tg = new Array(n);
        for (let i = 0; i < n - 1; i++) {
          dx[i] = xy[i + 1][0] - xy[i][0];
          m[i] = dx[i] ? (xy[i + 1][1] - xy[i][1]) / dx[i] : 0;
        }
        tg[0] = m[0];
        tg[n - 1] = m[n - 2];
        for (let i = 1; i < n - 1; i++) {
          tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
        }
        for (let i = 0; i < n - 1; i++) {
          if (!m[i]) { tg[i] = tg[i + 1] = 0; continue; }
          const a = tg[i] / m[i];
          const b = tg[i + 1] / m[i];
          const h = a * a + b * b;
          if (h > 9) {
            const k = 3 / Math.sqrt(h);
            tg[i] = k * a * m[i];
            tg[i + 1] = k * b * m[i];
          }
        }
        let d = `M${xy[0][0].toFixed(2)} ${xy[0][1].toFixed(2)}`;
        for (let i = 0; i < n - 1; i++) {
          const third = dx[i] / 3;
          d += `C${(xy[i][0] + third).toFixed(2)} ${(xy[i][1] + tg[i] * third).toFixed(2)} ${(xy[i + 1][0] - third).toFixed(2)} ${(xy[i + 1][1] - tg[i + 1] * third).toFixed(2)} ${xy[i + 1][0].toFixed(2)} ${xy[i + 1][1].toFixed(2)}`;
        }
        return d;
      }

      function paceSegments(resets, length, currentReset, now) {
        let list = (resets || []).filter(r => Array.isArray(r) && Number.isFinite(r[0]) && Number.isFinite(r[1]));
        const last = list[list.length - 1];
        const lastKnown = !!last && last[1] > 0;
        if (currentReset != null && Number.isFinite(currentReset) && (!last || now >= last[0])) {
          if (currentReset > 0 ? (!lastKnown || Math.abs(currentReset - last[1]) > RESET_DRIFT) : lastKnown) {
            list = list.concat([[now, currentReset > 0 ? currentReset : 0]]);
          }
        }
        const out = [];
        if (!(length > 0)) return out;
        list.forEach((r, i) => {
          const x = r[1];
          if (!(x > 0)) return;
          const next = list[i + 1];
          const a = Math.max(r[0], x - length);
          const b = next ? Math.min(next[0], x) : x;
          if (b > a) out.push([a, b, x, !!next && !(next[1] > 0) && next[0] <= x]);
        });
        return out;
      }

      function paceExtensions(segments, points, length) {
        const out = [];
        const pts = points || [];
        segments.forEach((s, i) => {
          const prev = segments[i - 1];
          if (prev && prev[1] === s[0] && !prev[3] && Math.abs(prev[2] - s[2]) <= RESET_DRIFT) return;
          if (s[0] <= s[2] - length + RESET_DRIFT) return;
          let start = null;
          for (let k = 1; k < pts.length && pts[k][0] <= s[0]; k++) {
            if (pts[k][0] >= s[2] - length - RESET_DRIFT && pts[k][1] - pts[k - 1][1] >= RESET_JUMP) {
              start = pts[k][0];
            }
          }
          if (start != null && start < s[0]) out.push([start, s[0], s[2]]);
        });
        return out;
      }

      function paceAt(segments, length, t) {
        let value = null;
        for (const s of segments) {
          if (t >= s[0] && (s[3] ? t < s[1] : t <= s[1])) {
            value = 100 * (s[2] - t) / length;
          }
        }
        return value;
      }

      function extendedPaceAt(extensions, length, t) {
        let value = null;
        for (const e of extensions) {
          if (t >= e[0] && t <= e[1]) {
            value = 100 * (e[2] - t) / length;
          }
        }
        return value;
      }

      function lineFit(pts, a, b) {
        const n = b - a + 1;
        const t0 = pts[a][0];
        let st = 0, sv = 0, stt = 0, stv = 0;
        for (let i = a; i <= b; i++) {
          const dt = pts[i][0] - t0;
          st += dt; sv += pts[i][1]; stt += dt * dt; stv += dt * pts[i][1];
        }
        const d = n * stt - st * st;
        const slope = d ? (n * stv - st * sv) / d : 0;
        const base = (sv - slope * st) / n;
        let error = 0;
        for (let i = a; i <= b; i++) {
          error = Math.max(error, Math.abs(base + slope * (pts[i][0] - t0) - pts[i][1]));
        }
        return { slope, error };
      }

      // Bottom-up piecewise linear regression (lamplighter recentSlope)
      function recentSlope(pts) {
        if (pts.length < 2) return 0;
        const pieces = [];
        for (let i = 0; i + 1 < pts.length; i++) pieces.push([i, i + 1]);
        const cost = (k) => lineFit(pts, pieces[k][0], pieces[k + 1][1]).error;
        const costs = [];
        for (let i = 0; i + 1 < pieces.length; i++) costs.push(cost(i));
        while (costs.length) {
          let best = 0;
          for (let i = 1; i < costs.length; i++) if (costs[i] < costs[best]) best = i;
          if (costs[best] > QUANTUM) break;
          pieces.splice(best, 2, [pieces[best][0], pieces[best + 1][1]]);
          costs.splice(best, 1);
          if (best < costs.length) costs[best] = cost(best);
          if (best > 0) costs[best - 1] = cost(best - 1);
        }
        const last = pieces[pieces.length - 1];
        return lineFit(pts, last[0], last[1]).slope;
      }

      function computeProjection(series, floor, g, lastRun, limit, windowKind, sampleStep) {
        const pts = series.points || [];
        if (!pts.length || g.to <= g.now || !lastRun || lastRun.end < g.now - limit) return null;
        const last = pts[pts.length - 1];
        if (!(last[1] > 0)) return null;

        let rate = null;
        let t0 = lastRun.end;
        const winLen = WINDOW_SECONDS[windowKind];

        if (windowKind === '7d') {
          const resetSec = series.reset_sec;
          const start = resetSec - winLen;
          const low = floor[floor.length - 1];
          if (low && resetSec > g.now && start < g.now && low[0] >= start) {
            rate = -(100 - low[1]) / (g.now - start);
          }
        } else {
          let startIdx = 0;
          for (let i = 1; i < floor.length; i++) {
            if (floor[i][1] > floor[i - 1][1]) startIdx = i;
          }
          const cycPts = floor.slice(startIdx);
          const tail = cycPts[cycPts.length - 1];
          const held = (g.now - tail[0]) > Math.max(HOLD_AFTER, sampleStep * 1.5);
          if (held) cycPts.push([g.now, tail[1]]);
          rate = recentSlope(cycPts);
          if (!held) t0 = last[0];
        }
        if (rate == null || !Number.isFinite(rate)) return null;

        const slope = Math.min(0, rate);
        const v0 = last[1];
        const out = slope < 0 ? t0 + v0 / -slope : Infinity;
        return {
          t0,
          v0,
          end: Math.min(out, g.to),
          out: out <= g.to ? out : null,
          left: out <= g.to ? 0 : Math.max(0, v0 + slope * (g.to - t0)),
          at: (t) => (t < t0 || t > g.to ? null : Math.max(0, v0 + slope * (t - t0))),
        };
      }

      function buildTicks(fromSec, toSec, plotW = 600, isMobile = false) {
        const span = Math.max(60, toSec - fromSec);
        const minPxPerTick = isMobile ? 48 : 66;
        const maxTicks = Math.max(3, Math.floor(plotW / minPxPerTick));
        const candidates = [
          600, 1200, 1800, 3600, 2 * 3600, 3 * 3600, 4 * 3600, 6 * 3600,
          8 * 3600, 12 * 3600, 86400, 2 * 86400, 3 * 86400, 5 * 86400, 7 * 86400, 10 * 86400,
        ];
        let step = candidates[candidates.length - 1];
        for (const c of candidates) {
          if (Math.floor(span / c) + 1 <= maxTicks) {
            step = c;
            break;
          }
        }
        const offsetSec = 8 * 3600; // Asia/Shanghai
        const list = [];
        for (let t = Math.ceil((fromSec + offsetSec) / step) * step - offsetSec; t <= toSec; t += step) {
          list.push(t);
        }
        return {
          list,
          label: (t) => span <= 2 * 86400 ? fmtHM(t * 1000) : fmtDay(t * 1000),
        };
      }

      function addHatchDefs(root, uid) {
        const defs = svgEl('defs');
        const pat = svgEl('pattern', { id: `${uid}_hatch`, width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
        pat.appendChild(svgEl('rect', { width: 2, height: 6, fill: cssVar('--chart-hatch') }));
        defs.appendChild(pat);

        const emptyPat = svgEl('pattern', { id: `${uid}_empty`, width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
        emptyPat.appendChild(svgEl('rect', { width: 2.5, height: 6, fill: cssVar('--q-empty-stripe') }));
        defs.appendChild(emptyPat);

        root.appendChild(defs);
        return defs;
      }

      function drawLevelRect(root, attrs, level, uid) {
        root.appendChild(svgEl('rect', { ...attrs, fill: levelColor(level) }));
        if (level === 'empty') {
          const stripeAttrs = { ...attrs };
          delete stripeAttrs['fill-opacity'];
          root.appendChild(svgEl('rect', { ...stripeAttrs, fill: `url(#${uid}_empty)` }));
        }
      }

      function drawHatchRect(root, g, a, b, y0, h, uid) {
        const ca = Math.max(a, g.from);
        const cb = Math.min(b, g.to);
        const w = g.x(cb) - g.x(ca);
        if (w > 1) {
          root.appendChild(svgEl('rect', { x: g.x(ca), y: y0, width: w, height: h, fill: `url(#${uid}_hatch)` }));
        }
      }

      function placeTipBox(tip, box, g, t, topPx) {
        const boxW = box.clientWidth || g.width;
        const scale = boxW / g.width;
        const tipW = tip.offsetWidth || 185;
        let left = g.x(t) * scale + 14;
        if (left + tipW + 8 > boxW) left = g.x(t) * scale - tipW - 14;
        tip.style.left = Math.max(4, left) + 'px';
        tip.style.top = Math.max(4, topPx) + 'px';
      }

      function hydrateAllCharts() {
        const ag = state.snapshot?.antigravity;
        if (ag && ag.accounts) {
          for (const acc of ag.accounts) {
            if (!acc.has_history || state.collapsedTrends.has(acc.id)) continue;
            renderAccountHistoryPanel(acc.id);
            const pref = getChartPref(acc.id);
            const key = historyCacheKey(acc.id, pref.window, currentRangeOf(pref));
            if (!state.historyCache.get(key)?.data) {
              fetchAccountHistory(acc.id, pref.window, currentRangeOf(pref), false);
            }
          }
        }
        renderAISHourlyChartSVG();
      }

      function redrawVisibleCharts() {
        const ag = state.snapshot?.antigravity;
        if (ag && ag.accounts) {
          for (const acc of ag.accounts) {
            if (!acc.has_history || state.collapsedTrends.has(acc.id)) continue;
            renderAccountHistoryPanel(acc.id);
          }
        }
        renderAISHourlyChartSVG();
      }

      function renderAccountHistoryPanel(accId) {
        const panel = document.querySelector(`[data-lamp-panel="${CSS.escape(accId)}"]`);
        if (!panel) return;
        const pref = getChartPref(accId);
        const curRange = currentRangeOf(pref);
        const cacheKey = historyCacheKey(accId, pref.window, curRange);
        const entry = state.historyCache.get(cacheKey);
        const rangeDefs = RANGES[pref.window] || RANGES['5h'];

        const winBtns = `
          <div class="seg seg-sm" role="group" aria-label="额度窗口">
            <button type="button" class="${pref.window === '5h' ? 'active' : ''}" data-lamp-win="${esc(accId)}" data-val="5h">5 小时额度</button>
            <button type="button" class="${pref.window === '7d' ? 'active' : ''}" data-lamp-win="${esc(accId)}" data-val="7d">7 天额度</button>
          </div>
        `;
        const rangeBtns = `
          <div class="seg seg-sm" role="group" aria-label="时间跨度">
            ${rangeDefs.map(r => `<button type="button" class="${curRange === r.key ? 'active' : ''}" data-lamp-range="${esc(accId)}" data-val="${esc(r.key)}">${esc(r.label)}</button>`).join('')}
          </div>
        `;

        panel.innerHTML = `
          <div class="lamp-toolbar">
            <div class="lamp-toolbar-primary">
              <span class="lamp-title">额度变化</span>
              ${winBtns}
            </div>
            <div class="lamp-toolbar-secondary">
              ${rangeBtns}
            </div>
            <button type="button" class="lamp-collapse-btn" data-trend-toggle="${esc(accId)}">收起 ▲</button>
          </div>
          <div class="lamp-body"></div>
        `;

        // Bind panel controls
        panel.querySelector('[data-trend-toggle]').addEventListener('click', () => {
          state.collapsedTrends.add(accId);
          saveCollapsedSet(state.collapsedTrends);
          render();
        });
        panel.querySelectorAll('[data-lamp-win]').forEach(btn => {
          btn.addEventListener('click', () => {
            const nextWin = btn.getAttribute('data-val');
            if (pref.window === nextWin) return;
            pref.window = nextWin;
            renderAccountHistoryPanel(accId);
            fetchAccountHistory(accId, pref.window, currentRangeOf(pref), false);
          });
        });
        panel.querySelectorAll('[data-lamp-range]').forEach(btn => {
          btn.addEventListener('click', () => {
            const nextRange = btn.getAttribute('data-val');
            if (pref.window === '7d') pref.range7d = nextRange;
            else pref.range5h = nextRange;
            renderAccountHistoryPanel(accId);
            fetchAccountHistory(accId, pref.window, nextRange, false);
          });
        });

        const body = panel.querySelector('.lamp-body');
        if (!entry || (entry.loading && !entry.data)) {
          body.innerHTML = `<div class="lamp-loading">正在加载${pref.window === '7d' ? ' 7 天' : ' 5 小时'}历史采样…</div>`;
          return;
        }
        if (!entry.data || !entry.data.series || entry.data.series.length === 0) {
          body.innerHTML = `<div class="lamp-loading">${esc(entry.error || '当前时间范围暂无历史采样数据')}</div>`;
          return;
        }

        const hist = entry.data;
        const seriesList = hist.series;
        let selected = seriesList.find(s => s.group === pref.selectedGroup);
        if (!selected) {
          selected = seriesList[0];
          pref.selectedGroup = selected.group;
        }

        drawDualLamplighterChart(body, accId, hist, selected, pref);
      }

      function drawDualLamplighterChart(container, accId, hist, selectedSeries, pref) {
        const uidBase = accId.replace(/[^a-zA-Z0-9_-]/g, '') + '_' + hist.window;
        const sampleStep = Math.max(hist.bucket_seconds || 0, hist.sample_step_sec || 900);
        const limit = sampleStep * 3.5;
        const nowSec = hist.to_sec;
        const rawSpan = Math.max(3600, hist.to_sec - hist.from_sec);
        const rangeMeta = (RANGES[hist.window] || []).find(r => r.key === hist.range);
        const allowAhead = rangeMeta ? rangeMeta.ahead : (hist.window === '5h' ? hist.range !== '3h' : !['24h', '3d'].includes(hist.range));

        let axisEnd = nowSec;
        if (allowAhead && selectedSeries.reset_sec > nowSec && (selectedSeries.reset_sec - nowSec) < rawSpan) {
          axisEnd = selectedSeries.reset_sec;
        }
        const axisFrom = axisEnd - rawSpan;

        // Precompute floor & projection before layout so mobile rightW only reserves space when needed
        const rows = hist.series.map(s => ({
          ...s,
          floor: cycleFloor(s.points || []),
        }));
        const selectedRow = rows.find(r => r.group === selectedSeries.group) || rows[0];
        const winLen = WINDOW_SECONDS[hist.window];
        const stretches = splitRuns(selectedRow.points || [], limit, nowSec);
        const lastRun = stretches[stretches.length - 1] || null;
        const ahead = computeProjection(
          selectedRow,
          selectedRow.floor,
          { from: axisFrom, to: axisEnd, now: nowSec },
          lastRun,
          limit,
          hist.window,
          sampleStep
        );

        const W = Math.max(260, Math.round(container.clientWidth || 720));
        const isMobile = W < 560;
        const needRightPct = !!(ahead && ahead.out == null);
        const labelW = isMobile ? 32 : 166;
        const rightW = isMobile ? (needRightPct ? 32 : 10) : 126;
        const plotW = Math.max(120, W - labelW - rightW);
        const g = {
          from: axisFrom,
          to: axisEnd,
          now: nowSec,
          width: W,
          labelW,
          rightW,
          plotW,
          x: (t) => labelW + ((t - axisFrom) / (axisEnd - axisFrom)) * plotW,
          t: (px) => axisFrom + ((px - labelW) / plotW) * (axisEnd - axisFrom),
        };
        const ticks = buildTicks(g.from, g.to, g.plotW, isMobile);

        // Shared hover/scrub bus between Overview Status Strip & Cycle Burn Detail Chart
        let hoverSource = '';
        let activeInlineScrub = false;
        const hoverListeners = [];
        const selPts = selectedRow.points || [];
        function snapTime(t) {
          if (t > g.now || !selPts.length) return Math.max(g.from, Math.min(g.to, t));
          let best = selPts[0][0], bestDist = Math.abs(best - t);
          for (const p of selPts) {
            const d = Math.abs(p[0] - t);
            if (d < bestDist) { bestDist = d; best = p[0]; }
          }
          return bestDist <= limit ? best : t;
        }
        function emitHover(t, rowGroup, inlineScrub = false) {
          activeInlineScrub = inlineScrub;
          for (const fn of hoverListeners) fn(t, rowGroup, inlineScrub);
        }
        scrubClearers.set('lamp_' + accId, () => {
          if (activeInlineScrub) emitHover(null, null, false);
        });

        container.innerHTML = `
          <div class="lamp-chart-box" data-role="strip"></div>
          <div class="lamp-detail-wrap" data-role="detail-wrap">
            <div class="lamp-detail-head" data-role="detail-head"></div>
            <div class="lamp-chart-box" data-role="detail-box"></div>
          </div>
          <div class="lamp-legend" data-role="legend"></div>
        `;

        // ---------- 1. Upper Status Strip ----------
        const stripBox = container.querySelector('[data-role="strip"]');
        const AXIS_H = isMobile ? 18 : 22;
        const LANE = isMobile ? 15 : 22;
        const ROW_H = isMobile ? 42 : LANE;
        const ROW_GAP = 6;
        const stripH = AXIS_H + rows.length * (ROW_H + ROW_GAP) + 2;
        const stripUid = uidBase + '_s';
        const stripSvg = svgEl('svg', { viewBox: `0 0 ${W} ${stripH}` });
        addHatchDefs(stripSvg, stripUid);

        const colBorder = cssVar('--border');
        const colBorderStrong = cssVar('--border-strong');
        const colText = cssVar('--text');
        const colText2 = cssVar('--text-2');
        const colText3 = cssVar('--text-3');
        const colSurface = cssVar('--surface');
        const colBlue = cssVar('--blue');
        const colLane = cssVar('--chart-lane');
        const colSelect = cssVar('--chart-select');

        for (const t of ticks.list) {
          const tx = g.x(t);
          if (!isMobile || (tx >= labelW - 6 && tx <= labelW + plotW + 10)) {
            stripSvg.appendChild(svgText({
              x: tx, y: isMobile ? 11 : 13,
              'text-anchor': 'middle',
              'font-size': isMobile ? 9.5 : 10.5,
              fill: colText3,
            }, ticks.label(t)));
          }
          if (tx > labelW + 3 && tx < labelW + plotW - 3) {
            stripSvg.appendChild(svgEl('line', {
              x1: tx, x2: tx, y1: AXIS_H - 3, y2: stripH - 2,
              stroke: colBorder, 'stroke-dasharray': '2 4',
            }));
          }
        }

        const rowY = {};
        rows.forEach((r, idx) => {
          const y0 = AXIS_H + idx * (ROW_H + ROW_GAP);
          const bandY = isMobile ? y0 + 21 : y0;
          rowY[r.group] = y0;
          const isSel = r.group === selectedRow.group;
          const lvl = quotaLevel(r.remaining);

          if (isSel) {
            stripSvg.appendChild(svgEl('rect', {
              x: 0, y: y0 - 2, width: W, height: ROW_H + 4,
              rx: 7, fill: colSelect,
            }));
            if (isMobile) {
              stripSvg.appendChild(svgEl('rect', {
                x: 2, y: y0 + 2, width: 3, height: ROW_H - 4,
                rx: 1.5, fill: colBlue,
              }));
            }
          }

          if (isMobile) {
            // Mobile 2-line strip: Top info row (left name, right single flowing tspan - zero overlap!) + Bottom full-width aligned band
            stripSvg.appendChild(svgText({
              x: isSel ? 10 : 6, y: y0 + 13.5,
              'font-size': 12,
              'font-weight': isSel ? 700 : 600,
              fill: isSel ? colText : colText2,
            }, r.label));

            const rightText = svgEl('text', {
              x: W - 6, y: y0 + 13.5,
              'text-anchor': 'end',
              'font-size': 11.5,
            });
            const tDot = svgEl('tspan', { fill: levelColor(lvl) });
            tDot.textContent = '● ';
            const tPct = svgEl('tspan', { 'font-weight': 700, fill: colText });
            tPct.textContent = fmtRoundPct(r.remaining);
            rightText.appendChild(tDot);
            rightText.appendChild(tPct);
            if (r.reset_sec > nowSec) {
              const tRst = svgEl('tspan', { fill: colText3, 'font-size': 10.5 });
              tRst.textContent = '  ↻ ' + fmtCompactCountdown(r.reset_sec * 1000);
              rightText.appendChild(tRst);
            }
            stripSvg.appendChild(rightText);
          } else {
            // Desktop single-line strip: Left name + Middle band + Right pct & countdown
            stripSvg.appendChild(svgText({
              x: 6, y: y0 + 15,
              'font-size': 12.5,
              'font-weight': isSel ? 700 : 600,
              fill: isSel ? colText : colText2,
            }, r.label));

            const rx = W - rightW + 12;
            drawLevelRect(stripSvg, { x: rx, y: y0 + 7, width: 8, height: 8, rx: 2 }, lvl, stripUid);
            stripSvg.appendChild(svgText({
              x: rx + 13, y: y0 + 15,
              'font-size': 12.5,
              'font-weight': 700,
              fill: colText,
            }, fmtRoundPct(r.remaining)));

            if (r.reset_sec > nowSec) {
              stripSvg.appendChild(svgText({
                x: W - 2, y: y0 + 15,
                'font-size': 11,
                'text-anchor': 'end',
                fill: colText3,
              }, '↻ ' + fmtCompactCountdown(r.reset_sec * 1000)));
            }
          }

          // Lane track aligned strictly with [labelW, labelW + plotW]
          stripSvg.appendChild(svgEl('rect', { x: labelW, y: bandY, width: plotW, height: LANE, rx: 3.5, fill: colLane }));

          // Draw color band
          let cursor = g.from;
          const segRuns = splitRuns(r.floor, limit, g.now);
          for (const run of segRuns) {
            if (run.start > cursor + limit) {
              drawHatchRect(stripSvg, g, cursor, run.start, bandY, LANE, stripUid);
            }
            cursor = run.end;
            const merged = [];
            run.pts.forEach((p, i) => {
              const segEnd = i + 1 < run.pts.length ? run.pts[i + 1][0] : run.end;
              const segLvl = quotaLevel(p[1]);
              const prevSeg = merged[merged.length - 1];
              if (prevSeg && prevSeg.level === segLvl) prevSeg.end = segEnd;
              else merged.push({ start: Math.max(g.from, p[0]), end: segEnd, level: segLvl });
            });
            for (const seg of merged) {
              if (seg.end <= g.from) continue;
              const x0 = Math.round(g.x(seg.start));
              const x1 = Math.max(x0 + 1, Math.round(g.x(Math.min(g.to, seg.end))));
              drawLevelRect(stripSvg, {
                x: x0, y: bandY, width: x1 - x0, height: LANE,
