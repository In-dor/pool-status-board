<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-pref="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="meta-theme-color" content="#f1f5f9" />
  <title>双号池额度与健康度看板</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261124-1" />
  <script>
    (function () {
      var pref = 'system';
      try {
        var saved = localStorage.getItem('psb_theme_pref');
        if (saved === 'light' || saved === 'dark' || saved === 'system') pref = saved;
      } catch (e) {}
      var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var resolved = isDark ? 'dark' : 'light';
      var root = document.documentElement;
      root.dataset.theme = resolved;
      root.dataset.themePref = pref;
      root.style.colorScheme = resolved;
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', isDark ? '#090d16' : '#f1f5f9');
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=20261124-1" />
</head>
<body id="top">
  <!-- Independent Centered Passcode Gate -->
  <section id="passcode-gate" class="gate-screen" hidden aria-label="访问口令验证">
    <div class="gate-top-actions">
      <button type="button" class="icon-btn gate-theme-btn" id="btn-theme-gate" title="切换主题（跟随系统 / 浅色 / 深色）" aria-label="切换主题">
        <span class="theme-icon-slot" data-theme-icon></span>
        <span class="theme-label-slot" data-theme-label>跟随系统</span>
      </button>
    </div>

    <div class="gate-card" id="gate-card">
      <div class="gate-brand">
        <div class="gate-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="g-ring-a" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
              <linearGradient id="g-ring-b" x1="54" y1="12" x2="12" y2="54" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="22" stroke="url(#g-ring-a)" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 52" transform="rotate(-35 32 32)"/>
            <circle cx="32" cy="32" r="13.5" stroke="url(#g-ring-b)" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="56 32" transform="rotate(145 32 32)"/>
            <circle class="pulse-core" cx="32" cy="32" r="4.6" fill="#34d399"/>
          </svg>
        </div>
        <h1 class="gate-title">双号池额度与健康度看板</h1>
        <p class="gate-subtitle">Antigravity &amp; AIStudio2API 实时只读监控 · 全程脱敏</p>
      </div>

      <form id="passcode-form" class="gate-form" novalidate>
        <label class="gate-label" for="passcode-input">访问口令</label>
        <div class="gate-input-wrap" id="gate-input-wrap">
          <input
            type="password"
            id="passcode-input"
            class="gate-input"
            aria-label="访问口令"
            placeholder="请输入访问口令"
            autocomplete="current-password"
            spellcheck="false"
          />
          <button type="button" class="gate-eye-btn" id="btn-toggle-eye" aria-label="显示口令" title="显示或隐藏口令">
            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
        <div class="gate-err" id="passcode-err" role="alert" aria-live="polite"></div>
        <button type="submit" class="gate-submit" id="btn-passcode-submit">
          <span class="gate-spinner" aria-hidden="true" hidden></span>
          <span class="gate-submit-text">验证并进入看板</span>
        </button>
      </form>

      <div class="gate-foot">输入一次后将在当前浏览器本地记住 · 仅用于只读状态查看</div>
    </div>
  </section>

  <!-- Main Dashboard Shell -->
  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <a href="#top" class="brand" aria-label="返回顶部">
            <span class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none">
                <defs>
                  <linearGradient id="h-ring-a" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#38bdf8"/>
                    <stop offset="100%" stop-color="#3b82f6"/>
                  </linearGradient>
                  <linearGradient id="h-ring-b" x1="54" y1="12" x2="12" y2="54" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#a78bfa"/>
                    <stop offset="100%" stop-color="#ec4899"/>
                  </linearGradient>
                </defs>
                <circle cx="32" cy="32" r="22" stroke="url(#h-ring-a)" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 52" transform="rotate(-35 32 32)"/>
                <circle cx="32" cy="32" r="13.5" stroke="url(#h-ring-b)" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="56 32" transform="rotate(145 32 32)"/>
                <circle cx="32" cy="32" r="4.8" fill="#34d399"/>
              </svg>
            </span>
            <span class="brand-title">双号池额度看板</span>
          </a>
          <nav class="pool-badges" id="pool-badges" aria-label="号池快捷跳转">
            <a class="status-pill" href="#section-antigravity"><span class="dot"></span>Antigravity</a>
            <a class="status-pill" href="#section-aistudio"><span class="dot"></span>AIStudio2API</a>
          </nav>
        </div>

        <div class="topbar-right">
          <div class="sync-meta num" id="sync-meta" title="自动静默同步">同步中…</div>
          <button type="button" class="icon-btn icon-only" id="btn-refresh" title="立即采集并刷新最新快照" aria-label="立即刷新">
            <svg class="refresh-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <polyline points="21 3 21 9 15 9"/>
            </svg>
          </button>
          <div class="seg seg-header" role="group" aria-label="视图模式">
            <button type="button" id="view-full" class="active">汇总 + 明细</button>
            <button type="button" id="view-summary">仅看汇总</button>
          </div>
          <button type="button" class="icon-btn theme-btn" id="btn-theme" title="切换主题（跟随系统 / 浅色 / 深色）" aria-label="切换主题">
            <span class="theme-icon-slot" data-theme-icon></span>
            <span class="theme-label-slot hide-xs" data-theme-label>跟随系统</span>
          </button>
        </div>
      </div>
    </header>

    <main id="app-root" class="container"></main>

    <footer class="footer container">
      只读公开看板 · 全程脱敏展示 · 仅读取内存快照与本地统计，不产生上游推理消耗
    </footer>
  </div>

  <script src="/app.js?v=20261124-1" defer></script>
</body>
</html>
